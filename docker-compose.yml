services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: crashaid
      POSTGRES_PASSWORD: crashaid
      POSTGRES_DB: crashaid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crashaid -d crashaid"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://crashaid:crashaid@db:5432/crashaid
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-dispatcher@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dispatcher-password-change-me}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
  redisdata:
